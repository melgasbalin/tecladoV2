# Solo el lado CENTRAL (mitad izquierda).
#
# En ZMK 0.3 estos simbolos estan dentro de "if ZMK_SPLIT_ROLE_CENTRAL"
# (app/src/split/bluetooth/Kconfig). Ponerlos en corne.conf, que se aplica a
# las dos mitades, hace que la build de corne_right emita:
#   warning: ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING ... was assigned the
#   value 'y' but got the value 'n'.
# El central lee la bateria de la mitad periferica y la publica como un segundo
# servicio de bateria hacia el host.
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_PROXY=y
