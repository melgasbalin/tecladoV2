# Nombre del teclado (Bluetooth)
CONFIG_ZMK_KEYBOARD_NAME="Hector Corne W"

# Combos
CONFIG_ZMK_COMBO_MAX_COMBOS_PER_KEY=5

# Mouse / Pointing
CONFIG_ZMK_POINTING=y

# Battery reporting
CONFIG_ZMK_BATTERY_REPORTING=y

# NOTA: las opciones de "battery sync" del split son SOLO para el central.
# Viven en config/corne_left.conf, no aqui: este archivo se aplica a las DOS
# mitades y en la derecha (periferica) esos simbolos no existen.

# NO fijar CONFIG_BT_MAX_CONN / CONFIG_BT_MAX_PAIRED a mano.
# ZMK ya usa 6 en el lado central (5 perfiles de host + 1 mitad periferica).
# Ponerlos en 5 deja solo 4 perfiles utiles y le quita al central el slot de
# bond reservado para la mitad derecha.
